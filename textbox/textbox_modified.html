<!DOCTYPE html>
<html lang="en">
<head>
  <title>textbox.page - Simple text box for writing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg-color: #181818;
      --textarea-bg: #1e1e1e;
      --text-color: #e8e8e8;
      --border-color: #444;
      --accent-color: #888;
      --font-size: 18px;
    }

    /* OLED THEMES */
    [data-theme="oled-white"] {
      --bg-color: #000000;
      --textarea-bg: #000000;
      --text-color: #ffffff;
      --border-color: #333;
      --accent-color: #ffffff;
    }

    [data-theme="oled-red"] {
      --bg-color: #000000;
      --textarea-bg: #000000;
      --text-color: #ff4d4d;
      --border-color: #660000;
      --accent-color: #ff0000;
    }

    [data-theme="oled-lime"] {
      --bg-color: #000000;
      --textarea-bg: #000000;
      --text-color: #b6ff00;
      --border-color: #2e6600;
      --accent-color: #7fff00;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
    }

    textarea {
      flex: 1;
      margin: 10px;
      padding: 15px;
      font-size: var(--font-size);
      background: var(--textarea-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--accent-color);
    }

    select, button {
      background: var(--textarea-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      margin: 4px;
    }

    select:focus, button:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    input[type="range"] {
      accent-color: var(--accent-color);
    }

    #byline {
      text-align: center;
      font-size: 12px;
      padding: 10px;
    }
  </style>
</head>

<body>
  <textarea id="t"></textarea>

  <div id="byline">
    <select id="theme">
      <option value="dark">Dark</option>
      <option value="oled-white">OLED White</option>
      <option value="oled-red">OLED Red</option>
      <option value="oled-lime">OLED Lime</option>
    </select>
  </div>

  <script>
    const textarea = document.getElementById("t");
    const themeSelect = document.getElementById("theme");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
    }

    themeSelect.addEventListener("change", () => {
      applyTheme(themeSelect.value);
    });

    function init() {
      const savedTheme = localStorage.getItem("theme") || "dark";
      themeSelect.value = savedTheme;
      applyTheme(savedTheme);

      textarea.value = localStorage.getItem("text") || "";
      textarea.addEventListener("input", () => {
        localStorage.setItem("text", textarea.value);
      });
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
