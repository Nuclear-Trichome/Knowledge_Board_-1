<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Reaction Tiles</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#f4f4f4;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}#title,#end{align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:24px}h1{font-size:clamp(28px,8vw,46px);margin:0 0 22px}.menu-btn{width:min(330px,90vw);min-height:55px;border:1px solid #555;border-radius:12px;background:#191919;color:#fff;font-weight:650}.sub{color:#aaa;font-size:13px;text-align:center}#game{flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#hud{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:10px}#clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}#pause{background:#222;color:white;border:1px solid #555;border-radius:10px;padding:12px 18px;min-width:100px}#field{flex:1;min-height:0;display:grid;gap:20px;padding:20px;align-content:stretch;touch-action:manipulation}#field.half{margin-top:auto;flex:0 0 50%;min-height:0}.tile{border:0;border-radius:10px;background:#ae2020;min-width:0;min-height:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}.tile.on{background:#659b16}#field.shaped{display:block;position:relative;overflow:hidden}#field.shaped .tile{position:absolute;transform:translate(-50%,-50%);border-radius:50%;}#field.shaped:not(.slices) .tile{min-width:0;min-height:0}#field.shaped:not(.slices) .tile[style*=height]{aspect-ratio:1}#field.shaped .tile{touch-action:manipulation}#field.shaped .tile.on{background:#659b16}#field.shaped:not(.slices) .tile{clip-path:none}#field.shaped:not(.slices) .tile[data-i]{ }#field.shaped.slices .tile{inset:5%;width:90%;height:90%;transform:none;border-radius:50%;}#field.shaped:not(.slices) .tile{background:#ae2020}#field.shaped:not(.slices) .tile.on{background:#659b16}#field.shaped:not(.slices) .tile{ -webkit-appearance:none }#field.shaped:not(.slices) .tile{ }#field.shaped.hex .tile{clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);border-radius:0}.overlay{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.show{display:flex}.modal{background:#171717;border:1px solid #484848;border-radius:16px;padding:20px;width:min(500px,100%);max-height:85dvh;overflow:auto;overscroll-behavior:contain}.modal h2{margin:0 0 15px}.modal label{display:block;margin:13px 0;font-size:14px}.modal input,.modal select,.modal textarea{display:block;width:100%;margin-top:5px;border-radius:8px;border:1px solid #555;background:#090909;color:white;padding:11px}.modal textarea{height:210px;font:11px ui-monospace,monospace;resize:vertical}.modal button{padding:11px 14px;background:#333;border:1px solid #555;border-radius:8px;color:#fff;margin:5px 5px 5px 0}.history{max-height:55dvh;overflow:auto}.record{width:100%;display:block;text-align:left;padding:13px!important;margin:6px 0!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{color:#aaa;font-size:12px}#summary{text-align:center;color:#aaa;margin:0 0 12px}#end{transition:opacity .38s ease,transform .38s ease}#end.end-enter{opacity:0;transform:translateY(14px);pointer-events:none}#end.end-locked{pointer-events:none}#end.end-locked button{opacity:.45}#statsGraph{display:block;width:100%;height:auto;background:#0b0b0b;border:1px solid #383838;border-radius:10px;margin:12px 0}#statsInfo{font-size:13px;color:#bbb;line-height:1.5}#statsSelect{width:100%;padding:10px;background:#090909;color:white;border:1px solid #555;border-radius:8px} @media(prefers-reduced-motion:reduce){#end{transition:none}}
</style></head><body>
<section id="title" class="screen active"><h1>Reaction Tiles</h1><button class="menu-btn" id="start">Start</button><button class="menu-btn" id="settingsBtn">Settings</button><button class="menu-btn" id="historyBtn">Past run measurements</button><button class="menu-btn" id="statsBtn">Reaction stats</button><p class="sub">Offline • Export backups if storage is restricted</p><p id="storageNotice" class="sub" hidden style="color:#ffbc74">Device storage unavailable: export runs before closing this page.</p></section>
<section id="game" class="screen"><header id="hud"><span id="clock">00:30.00</span><button id="pause">Pause</button></header><main id="field"></main></section>
<section id="end" class="screen"><h1 id="endTitle">Paused</h1><p id="summary"></p><button class="menu-btn" id="resume">Resume</button><button class="menu-btn" id="restart">Restart</button><button class="menu-btn" id="quit">End to title</button></section>
<div id="overlay" class="overlay"><div id="modal" class="modal"></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),defaults={count:12,layout:'grid',coverage:'full',duration:30,minInterval:250,maxInterval:850,acceleration:0,postSpawnDelay:0};let settings=load('rt_settings_v2',defaults),history=load('rt_history_v2',[]);let run=null,phase='title',timer=0,spawnTimer=0,active=-1,litAt=0,pausedAt=0,lastFrame=0;const debug=[];const MAX_HISTORY=150,MAX_EVENTS=20000;let modalStack=[];let storageAvailable=true,endUnlockTimer=0;const storedIds=new Set(history.map(r=>r.id));
function load(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x&&typeof x==='object'?x:fallback}catch{return fallback}}
function save(key,obj){try{localStorage.setItem(key,JSON.stringify(obj));storageAvailable=true;updateStorageNotice();return true}catch(e){storageAvailable=false;log('storage_error',String(e));updateStorageNotice();return false}}
 function updateStorageNotice(){const n=$('storageNotice');if(n)n.hidden=storageAvailable}
 function downloadJSON(text,name){const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function log(type,detail){if(run&&run.events.length<MAX_EVENTS)run.events.push({t:Math.round(performance.now()-run.startedPerf),type,detail});else if(!run)debug.push({type,detail})}
function show(id){if(id!=='end'){clearTimeout(endUnlockTimer);$('end').classList.remove('end-enter','end-locked')}for(const el of document.querySelectorAll('.screen'))el.classList.toggle('active',el.id===id);phase=id}
function modal(html){modalStack.push(html);$('modal').innerHTML=html;$('overlay').classList.add('show')}
function closeModal(){if($('s_count'))syncSettingsFromForm();modalStack.pop();if(modalStack.length){const previous=modalStack.pop();if(previous.includes('id="s_count"')){settingsModal();return}if(previous.includes('id="historyRows"')){historyModal();return}$('modal').innerHTML=previous}else{$('overlay').classList.remove('show');$('modal').onchange=null}}
$('overlay').addEventListener('pointerdown',e=>{if(e.target===$('overlay'))closeModal()});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function normalize(){settings.count=clamp(Math.round(+settings.count||12),2,100);settings.duration=clamp(+settings.duration||30,1,3600);settings.minInterval=clamp(+settings.minInterval||0,0,10000);settings.maxInterval=clamp(+settings.maxInterval||0,0,10000);settings.maxInterval=Math.max(settings.minInterval,settings.maxInterval);settings.acceleration=clamp(+settings.acceleration||0,-1000,1000);settings.postSpawnDelay=clamp(+settings.postSpawnDelay||0,0,10000);settings.layout=['grid','bars','dots','hex','slices'].includes(settings.layout)?settings.layout:'grid';settings.coverage=['full','half'].includes(settings.coverage)?settings.coverage:'full'}
function showEndMenu(){
 clearTimeout(endUnlockTimer);
 const el=$('end');el.classList.add('end-enter','end-locked');
 for(const b of el.querySelectorAll('button'))b.disabled=true;
 show('end');
 requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('end-enter')));
 endUnlockTimer=setTimeout(()=>{if(phase!=='end')return;el.classList.remove('end-locked');for(const b of el.querySelectorAll('button'))b.disabled=false},1000);
}
function statsModal(){
 modal(`<h2>Reaction stats</h2><p class="hint">Reaction time across taps for a selected run. Lower is faster.</p><select id="statsSelect" aria-label="Select run"></select><svg id="statsGraph" viewBox="0 0 420 220" role="img" aria-label="Reaction time line graph"></svg><div id="statsInfo"></div><button id="statsClose">Close</button>`);
 const sel=$('statsSelect');
 if(!history.length){sel.disabled=true;$('statsInfo').textContent='No recorded runs yet. Finish a run to see a graph.'}
 history.slice().reverse().forEach((r,i)=>{const o=document.createElement('option');o.value=String(history.length-1-i);o.textContent=`${new Date(r.startedAt).toLocaleString()} - ${r.hits} hits`;sel.appendChild(o)});
 const render=()=>{
 const svg=$('statsGraph');svg.replaceChildren();
 const NS='http://www.w3.org/2000/svg';
 const add=(tag,attrs,text)=>{const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));if(text!==undefined)el.textContent=text;svg.appendChild(el);return el};
 const r=history[+sel.value],samples=r&&Array.isArray(r.samples)?r.samples.filter(x=>Number.isFinite(x.reactionMs)):[];
 if(!samples.length){add('text',{x:210,y:110,fill:'#aaa','text-anchor':'middle','font-size':13},'No reaction samples');return}
 const values=samples.map(x=>x.reactionMs),min=Math.max(0,Math.floor(Math.min(...values)/100)*100-100),max=Math.max(min+100,Math.ceil(Math.max(...values)/100)*100+100);
 const x=i=>36+i*370/Math.max(1,values.length-1),y=v=>185-(v-min)*155/(max-min);
 for(let j=0;j<=4;j++){const v=min+(max-min)*j/4,yy=y(v);add('line',{x1:36,y1:yy,x2:408,y2:yy,stroke:'#333','stroke-width':1});add('text',{x:30,y:yy+4,fill:'#aaa','text-anchor':'end','font-size':10},Math.round(v))}
 add('polyline',{points:values.map((v,i)=>`${x(i)},${y(v)}`).join(' '),fill:'none',stroke:'#85c934','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'});
 add('text',{x:36,y:207,fill:'#aaa','font-size':11},'Tap 1');add('text',{x:408,y:207,fill:'#aaa','font-size':11,'text-anchor':'end'},`Tap ${values.length}`);
 $('statsInfo').textContent=`${values.length} hits | Mean: ${r.meanMs ?? '-'} ms | Median: ${r.medianMs ?? '-'} ms | Min: ${r.minMs ?? '-'} ms | Max: ${r.maxMs ?? '-'} ms | Misses: ${r.misses ?? 0}`;
 };
 sel.onchange=render;$('statsClose').onclick=closeModal;render();
}
function settingsModal(){normalize();modal(`<h2>Settings</h2><label>Tile count<input id="s_count" type="number" min="2" max="100" value="${settings.count}"></label><label>Layout<select id="s_layout"><option value="grid">Grid</option><option value="bars">Horizontal bars</option><option value="dots">Circle of dots</option><option value="hex">Hexagons (honeycomb)</option><option value="slices">Circle slices</option></select></label><label>Coverage<select id="s_coverage"><option value="full">Full screen (below HUD)</option><option value="half">Bottom half</option></select></label><label>Time limit (seconds)<input id="s_duration" type="number" min="1" max="3600" step="1" value="${settings.duration}"></label><label>First green spawn delay minimum (ms)<input id="s_minInterval" type="number" min="0" max="10000" value="${settings.minInterval}"></label><label>First green spawn delay maximum (ms)<input id="s_maxInterval" type="number" min="0" max="10000" value="${settings.maxInterval}"></label><label>Post-hit spawn delay (ms; 0 = instant)<input id="s_postSpawnDelay" type="number" min="0" max="10000" step="1" value="${settings.postSpawnDelay}"></label><label>Initial delay acceleration (ms per second; positive = faster)<input id="s_acceleration" type="number" min="-1000" max="1000" value="${settings.acceleration}"></label><button id="exportBtn">Export data</button><p class="hint">Changes save automatically when you close this dialog. A green tile appears after a random delay; after a successful tap the next tile appears after the post-hit delay. Reaction time starts when the next tile lights up.</p>`);$('s_layout').value=settings.layout;$('s_coverage').value=settings.coverage;
const sync=()=>{for(const k of ['count','duration','minInterval','maxInterval','acceleration','postSpawnDelay','layout','coverage'])settings[k]=$('s_'+k).value;normalize();save('rt_settings_v2',settings)};
$('modal').onchange=sync;$('exportBtn').onclick=()=>{sync();exportModal()};}
function syncSettingsFromForm(){if(!$('s_count'))return;for(const k of ['count','duration','minInterval','maxInterval','acceleration','postSpawnDelay','layout','coverage'])settings[k]=$('s_'+k).value;normalize();save('rt_settings_v2',settings)}
 function exportModal(){const text=JSON.stringify({schema:2,exportedAt:new Date().toISOString(),settings,history,activeRun:run?serializeRun(run,true):null,debug},null,2);modal(`<h2>Measurement + debug export</h2><textarea id="exportText" readonly></textarea><button id="copyExport">Copy</button><button id="downloadExport">Download JSON</button><button id="backExport">Back</button>`);$('exportText').value=text;$('copyExport').onclick=async()=>{try{await navigator.clipboard.writeText(text)}catch{$('exportText').select();document.execCommand('copy')}};$('downloadExport').onclick=()=>downloadJSON(text,'reaction-tiles-export-'+Date.now()+'.json');$('backExport').onclick=closeModal}
function historyModal(){modal(`<h2>Past runs (${history.length})</h2><p class="hint">Double tap a row to view full details.</p><div class="history" id="historyRows"></div><button id="exportHistory">Export data</button><button id="closeHistory">Close</button>`);const rows=$('historyRows');if(!history.length)rows.textContent='No saved runs yet.';history.slice().reverse().forEach((r,i)=>{const b=document.createElement('button');b.className='record';b.textContent=`${new Date(r.startedAt).toLocaleString()} | ${r.reason} | ${r.hits} hits | mean ${r.meanMs==null?'—':r.meanMs+' ms'}`;let last=0;b.onclick=()=>{const now=performance.now();if(now-last<430){detailModal(r);last=0}else last=now};rows.appendChild(b)});$('exportHistory').onclick=exportModal;$('closeHistory').onclick=closeModal}
function detailModal(r){modal(`<h2>Run details</h2><textarea id="detailText" readonly></textarea><button id="copyDetail">Copy</button><button id="downloadDetail">Download JSON</button><button id="backDetail">Back</button>`);const text=JSON.stringify(r,null,2);$('detailText').value=text;$('copyDetail').onclick=()=>{navigator.clipboard?.writeText(text).catch(()=>{$('detailText').select();document.execCommand('copy')})};$('downloadDetail').onclick=()=>downloadJSON(text,'reaction-tiles-run-'+r.id+'.json');$('backDetail').onclick=closeModal}
function buildTiles(){
 const field=$('field');field.replaceChildren();field.className=settings.coverage==='half'?'half':'';
 field.classList.toggle('shaped',['dots','hex','slices'].includes(settings.layout));
 field.classList.toggle('slices',settings.layout==='slices');field.classList.toggle('hex',settings.layout==='hex');
 field.style.gridTemplateColumns='';field.style.gridTemplateRows='';
 const n=settings.count,layout=settings.layout;
 if(layout==='grid'||layout==='bars'){
  const cols=layout==='bars'?1:Math.ceil(Math.sqrt(n));
  field.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  field.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)},minmax(0,1fr))`;
 }
 const frag=document.createDocumentFragment();
 for(let i=0;i<n;i++){
  const b=document.createElement('button');b.className='tile';b.type='button';b.dataset.i=i;b.setAttribute('aria-label',`Tile ${i+1}`);
  if(layout==='dots'){
   const angle=-Math.PI/2+2*Math.PI*i/n;
   const diameter=Math.min(28,Math.max(7,70*Math.sin(Math.PI/n)*1.6));
   b.style.cssText=`left:${50+35*Math.cos(angle)}%;top:${50+35*Math.sin(angle)}%;width:${diameter}%;height:${diameter}%;`;
  }else if(layout==='hex'){
   const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols);
   const col=i%cols,row=Math.floor(i/cols);
   const w=90/(cols+.5),h=88/(rows*.78+.22);
   b.style.cssText=`left:${5+(col+.5+(row%2)*.5)*w}%;top:${6+(row*.78+.5)*h}%;width:${w*.91}%;height:${h*.91}%;`;
  }else if(layout==='slices'){
   const a=360*i/n,z=360/n,gap=Math.min(2.2,z*.07);
   b.style.cssText=`clip-path:polygon(50% 50%, ${sectorPoints(a+gap,a+z-gap).join(',')});`;
  }
  frag.appendChild(b);
 }
 field.appendChild(frag)
}
function sectorPoints(start,end){
 const pts=[];const steps=Math.max(2,Math.ceil((end-start)/5));
 for(let j=0;j<=steps;j++){const a=(start+(end-start)*j/steps-90)*Math.PI/180;pts.push(`${50+49*Math.cos(a)}% ${50+49*Math.sin(a)}%`)}
 return pts
}
function randomOther(){const n=settings.count;if(active<0)return Math.floor(Math.random()*n);const i=Math.floor(Math.random()*(n-1));return i>=active?i+1:i}
function light(i,now){if(active>=0)$('field').children[active].classList.remove('on');active=i;litAt=now;$('field').children[i].classList.add('on');log('spawn',{tile:i})}
function scheduleNext(now,delay,previous){clearTimeout(spawnTimer);run.spawnDue=now+delay;const pick=Math.floor(Math.random()*(settings.count-1));run.pendingTile=pick>=previous?pick+1:pick;log('spawn_scheduled',{delay:Math.round(delay),kind:'post_hit'});if(delay===0){light(run.pendingTile,now);run.pendingTile=-1;return}spawnTimer=setTimeout(()=>{if(phase==='game'&&run&&active<0){light(run.pendingTile,performance.now());run.pendingTile=-1}},delay)}
function scheduleSpawn(now){clearTimeout(spawnTimer);const elapsed=(settings.duration*1000-run.remaining)/1000;const adjustment=settings.acceleration*elapsed;const lo=clamp(settings.minInterval-adjustment,0,10000),hi=clamp(settings.maxInterval-adjustment,lo,10000);const delay=lo+Math.random()*(hi-lo);run.nextDelay=delay;spawnTimer=setTimeout(()=>{if(phase==='game'&&run&&active<0)light(randomOther(),performance.now())},delay);run.spawnDue=now+delay;log('spawn_scheduled',{delay:Math.round(delay)})}
function start(){normalize();save('rt_settings_v2',settings);clearTimeout(spawnTimer);cancelAnimationFrame(timer);run={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),startedAt:new Date().toISOString(),startedPerf:performance.now(),settings:{...settings},remaining:settings.duration*1000,hits:[],misses:0,events:[],reason:null,pendingTile:-1};active=-1;buildTiles();show('game');$('pause').textContent='Pause';scheduleSpawn(performance.now());lastFrame=performance.now();tick(lastFrame)}
function tick(now){if(phase!=='game')return;run.remaining=Math.max(0,run.remaining-(now-lastFrame));lastFrame=now;const t=run.remaining;$('clock').textContent=`${String(Math.floor(t/60000)).padStart(2,'0')}:${String(Math.floor(t%60000/1000)).padStart(2,'0')}.${String(Math.floor(t%1000/10)).padStart(2,'0')}`;if(t<=0){finish('timeout');return}timer=requestAnimationFrame(tick)}
$('field').addEventListener('pointerdown',e=>{const b=e.target.closest('.tile');if(!b||phase!=='game'||!run)return;e.preventDefault();const now=performance.now(),i=+b.dataset.i;if(now-lastFrame>=run.remaining){run.remaining=0;finish('timeout');return}if(active<0)return;if(i!==active){run.misses++;log('miss',{tile:i,active});return}const reaction=Math.max(0,now-litAt);run.hits.push({tile:i,reactionMs:Math.round(reaction*100)/100,elapsedMs:Math.round(now-run.startedPerf)});log('hit',{tile:i,reactionMs:Math.round(reaction*100)/100});const previous=active;active=-1;b.classList.remove('on');scheduleNext(now,run.settings.postSpawnDelay||0,previous)});
function pause(){if(phase!=='game')return;cancelAnimationFrame(timer);clearTimeout(spawnTimer);pausedAt=performance.now();run.pauseDelay=active<0?Math.max(0,run.spawnDue-pausedAt):null;log('pause',{});showEndMenu();$('endTitle').textContent='Paused';$('resume').hidden=false;summary()}
function resume(){if(!run||run.remaining<=0)return;const now=performance.now();run.startedPerf+=now-pausedAt;if(active>=0)litAt+=now-pausedAt;else{const delay=run.pauseDelay??0;run.spawnDue=now+delay;spawnTimer=setTimeout(()=>{if(phase==='game'&&active<0){light(run.pendingTile>=0?run.pendingTile:randomOther(),performance.now());run.pendingTile=-1}},delay)}log('resume',{});show('game');lastFrame=now;tick(now)}
function stats(r){const a=r.hits.map(x=>x.reactionMs).sort((a,b)=>a-b),n=a.length;return{hits:n,misses:r.misses,meanMs:n?Math.round(a.reduce((s,x)=>s+x,0)/n*100)/100:null,medianMs:n?Math.round((a[Math.floor((n-1)/2)]+a[Math.floor(n/2)])/2*100)/100:null,minMs:n?a[0]:null,maxMs:n?a[n-1]:null}}
function serializeRun(r,live=false){return{id:r.id,startedAt:r.startedAt,endedAt:live?null:new Date().toISOString(),reason:r.reason||'in_progress',settings:r.settings,...stats(r),samples:r.hits,events:r.events,remainingMs:Math.round(r.remaining)}}
function rememberRun(r){if(storedIds.has(r.id))return;storedIds.add(r.id);history.push(r);if(history.length>MAX_HISTORY){history=history.slice(-MAX_HISTORY);storedIds.clear();history.forEach(x=>storedIds.add(x.id))}save('rt_history_v2',history)}
 function summary(){if(!run)return;const s=stats(run);$('summary').textContent=`${s.hits} hits • ${s.misses} misses • mean ${s.meanMs??'—'} ms`}
function finish(reason){if(!run||run.reason)return;cancelAnimationFrame(timer);clearTimeout(spawnTimer);run.reason=reason;log('end',{reason});const r=serializeRun(run);rememberRun(r);showEndMenu();$('endTitle').textContent=reason==='timeout'?'Time up':'Run ended';$('resume').hidden=true;summary();run=null}
$('start').onclick=start;$('settingsBtn').onclick=settingsModal;$('historyBtn').onclick=historyModal;$('statsBtn').onclick=statsModal;$('pause').onclick=pause;$('resume').onclick=resume;$('restart').onclick=start;$('quit').onclick=()=>{if(run)finish('quit');show('title')};document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='game')pause()});window.addEventListener('pagehide',()=>{if(run){run.reason='page_exit';const r=serializeRun(run);rememberRun(r)}});
try{const probe='rt_storage_probe';localStorage.setItem(probe,'1');localStorage.removeItem(probe)}catch(e){storageAvailable=false;debug.push({type:'storage_unavailable',detail:String(e)})}updateStorageNotice();window.__reactionTest={getState:()=>({phase,active,run,settings,historyCount:history.length}),start,pause,resume,finish};normalize();})();
</script></body></html>
