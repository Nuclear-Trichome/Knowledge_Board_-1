<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local GIF Combiner (iOS)</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; padding: 16px; background:#0b0b0c; color:#f3f3f3; }
    .card { max-width: 900px; margin: 0 auto; padding: 16px; border: 1px solid #2a2a2e; border-radius: 12px; background:#121216; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 8px 0; color:#c8c8d0; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    button, input[type="file"]::file-selector-button {
      background:#2b6cff; color:#fff; border:0; border-radius:10px; padding:10px 12px;
      font-weight:600; cursor:pointer;
    }
    button:disabled { opacity:.5; cursor:not-allowed; }
    input[type="file"] { width: 100%; }
    .small { font-size: 12px; color:#a9a9b4; }
    .grid { display:grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
    @media (min-width: 720px){ .grid { grid-template-columns: 1fr 1fr; } }
    .panel { border: 1px solid #2a2a2e; border-radius: 12px; padding: 12px; background:#0f0f13; }
    .list { display:flex; flex-direction:column; gap:8px; max-height: 260px; overflow:auto; }
    .item { display:flex; justify-content:space-between; gap:8px; padding:8px; border-radius:10px; background:#15151b; }
    .item b { font-size: 13px; }
    .item span { font-size: 12px; color:#b7b7c2; }
    .progress { height: 10px; background:#1b1b22; border-radius: 999px; overflow:hidden; }
    .bar { height: 100%; width:0%; background:#2b6cff; transition: width .15s linear; }
    img, video { max-width:100%; border-radius: 12px; border: 1px solid #2a2a2e; background:#0b0b0c; }
    .warn { color:#ffd27a; }
    .err { color:#ff8a8a; white-space: pre-wrap; }
    .ok { color:#8cffb1; }
    .controls { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
    label { display:flex; gap:8px; align-items:center; }
    input[type="number"] { width: 90px; padding:8px; border-radius:10px; border: 1px solid #2a2a2e; background:#0b0b0c; color:#fff; }
    select { padding:8px; border-radius:10px; border: 1px solid #2a2a2e; background:#0b0b0c; color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Local GIF Combiner (iOS Safari)</h1>
    <p>Select multiple GIFs and combine them end-to-end into one new GIF. Everything stays on your device.</p>
    <p class="small warn">
      iOS memory is limited. Start with small GIFs (e.g., under ~5–10MB each). If it crashes, reduce size/frames.
    </p>

    <div class="row" style="margin-top:12px;">
      <input id="files" type="file" accept="image/gif" multiple />
    </div>

    <div class="controls" style="margin-top:12px;">
      <label class="small">Output width:
        <select id="outWMode">
          <option value="max" selected>Max of inputs</option>
          <option value="first">First GIF</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <input id="outWCustom" type="number" min="16" step="1" value="480" disabled />

      <label class="small">Output height:
        <select id="outHMode">
          <option value="max" selected>Max of inputs</option>
          <option value="first">First GIF</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <input id="outHCustom" type="number" min="16" step="1" value="480" disabled />

      <label class="small">Scale:
        <select id="scaleMode">
          <option value="contain" selected>Contain (letterbox)</option>
          <option value="cover">Cover (crop)</option>
          <option value="stretch">Stretch</option>
        </select>
      </label>

      <label class="small">FPS cap:
        <input id="fpsCap" type="number" min="1" max="60" value="30" />
      </label>
    </div>

    <div class="row" style="margin-top:12px;">
      <button id="combine" disabled>Combine GIFs</button>
      <a id="downloadLink" style="display:none; color:#9ec1ff; font-weight:700;" download="combined.gif">Download combined.gif</a>
    </div>

    <div style="margin-top:12px;">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="small" id="status" style="margin-top:8px;">Idle.</div>
      <div class="err" id="error"></div>
    </div>

    <div class="grid">
      <div class="panel">
        <b>Selected GIFs</b>
        <div class="list" id="list" style="margin-top:10px;"></div>
      </div>
      <div class="panel">
        <b>Output preview</b>
        <div style="margin-top:10px;">
          <img id="preview" alt="Output preview will appear here" />
        </div>
      </div>
    </div>
  </div>

  <!--
    Libraries:
    - gifuct-js (decode)
    - gif.js (encode)

    For truly offline use:
    1) Download these files and change the <script src="..."> paths to local copies.
    2) Serve the folder via Files app + local web server, or any static server.
  -->
  <script src="https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/dist/gifuct.min.js" onerror="window.__LIB_LOAD_ERROR__ = (window.__LIB_LOAD_ERROR__||[]).concat(['gifuct-js failed to load']);"></script>
  <script src="https://cdn.jsdelivr.net/npm/gif.js.optimized@1.0.1/dist/gif.js" onerror="window.__LIB_LOAD_ERROR__ = (window.__LIB_LOAD_ERROR__||[]).concat(['gif.js failed to load']);"></script>

  <script>
    // ---- Helpers ----
    const $ = (id) => document.getElementById(id);
    const filesEl = $("files");
    const combineBtn = $("combine");
    const listEl = $("list");
    const statusEl = $("status");
    const errorEl = $("error");
    const barEl = $("bar");
    const previewEl = $("preview");
    const downloadLink = $("downloadLink");

    const outWMode = $("outWMode");
    const outHMode = $("outHMode");
    const outWCustom = $("outWCustom");
    const outHCustom = $("outHCustom");
    const scaleMode = $("scaleMode");
    const fpsCapEl = $("fpsCap");


    // ---- Library resolution (robust across builds/offline) ----
    // gifuct-js may attach as window.gifuct OR export parseGIF/decompressFrames directly
    const gifuctApi = (window.gifuct && (window.gifuct.parseGIF || window.gifuct.decompressFrames)) ? window.gifuct : window;
    const parseGIF = gifuctApi.parseGIF;
    const decompressFrames = gifuctApi.decompressFrames;

    // gif.js encoder is usually window.GIF (constructor)
    const GIFEncoderCtor = window.GIF;

    function libsReady() {
      const errs = window.__LIB_LOAD_ERROR__ || [];
      const missing = [];
      if (typeof parseGIF !== "function" || typeof decompressFrames !== "function") missing.push("gifuct-js (parseGIF/decompressFrames)");
      if (typeof GIFEncoderCtor !== "function") missing.push("gif.js (GIF)");
      return { ok: missing.length === 0 && errs.length === 0, missing, errs };
    }

    function showLibErrorIfAny() {
      const st = libsReady();
      if (st.ok) return false;
      const parts = [];
      if (st.errs.length) parts.push(st.errs.join("\n"));
      if (st.missing.length) parts.push("Missing globals: " + st.missing.join(", "));
      parts.push("");
      parts.push("This usually happens when you open the HTML from iCloud/Files while offline, or a content blocker blocks CDN scripts.");
      parts.push("Fix: connect to the internet OR download the library files and reference them locally (see offline notes).");
      setError(parts.join("\n"));
      setProgress(0, "Libraries not loaded.");
      combineBtn.disabled = true;
      return true;
    }

    document.addEventListener("DOMContentLoaded", () => {
      // disable combine if libs aren't present
      showLibErrorIfAny();
    });

    function setProgress(pct, msg) {
      barEl.style.width = `${Math.max(0, Math.min(100, pct))}%`;
      if (msg) statusEl.textContent = msg;
    }

    function setError(msg) {
      errorEl.textContent = msg || "";
    }

    function formatBytes(bytes) {
      const units = ["B","KB","MB","GB"];
      let i = 0, n = bytes;
      while (n >= 1024 && i < units.length-1) { n /= 1024; i++; }
      return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function updateCustomInputs() {
      outWCustom.disabled = outWMode.value !== "custom";
      outHCustom.disabled = outHMode.value !== "custom";
    }
    outWMode.addEventListener("change", updateCustomInputs);
    outHMode.addEventListener("change", updateCustomInputs);
    updateCustomInputs();

    // Draw an ImageData onto a canvas with scaling modes
    function drawFrameToCanvas(ctx, frameImageData, dstW, dstH, mode) {
      // Put decoded full-frame ImageData onto a temp canvas
      const srcW = frameImageData.width;
      const srcH = frameImageData.height;

      const tmp = document.createElement("canvas");
      tmp.width = srcW;
      tmp.height = srcH;
      tmp.getContext("2d").putImageData(frameImageData, 0, 0);

      ctx.clearRect(0, 0, dstW, dstH);

      if (mode === "stretch") {
        ctx.drawImage(tmp, 0, 0, dstW, dstH);
        return;
      }

      const srcAR = srcW / srcH;
      const dstAR = dstW / dstH;

      let drawW, drawH, dx, dy;

      if (mode === "contain") {
        if (srcAR > dstAR) { // fit width
          drawW = dstW;
          drawH = Math.round(dstW / srcAR);
        } else { // fit height
          drawH = dstH;
          drawW = Math.round(dstH * srcAR);
        }
        dx = Math.round((dstW - drawW) / 2);
        dy = Math.round((dstH - drawH) / 2);
        ctx.drawImage(tmp, dx, dy, drawW, drawH);
        return;
      }

      // cover
      if (srcAR > dstAR) { // wider than dst -> fit height, crop sides
        drawH = dstH;
        drawW = Math.round(dstH * srcAR);
      } else { // taller -> fit width, crop top/bot
        drawW = dstW;
        drawH = Math.round(dstW / srcAR);
      }
      dx = Math.round((dstW - drawW) / 2);
      dy = Math.round((dstH - drawH) / 2);
      ctx.drawImage(tmp, dx, dy, drawW, drawH);
    }

    async function readAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsArrayBuffer(file);
      });
    }

    // ---- UI: file selection ----
    let selectedFiles = [];

    filesEl.addEventListener("change", () => {
      setError("");
      downloadLink.style.display = "none";
      previewEl.removeAttribute("src");
      selectedFiles = Array.from(filesEl.files || []).filter(f => f.type === "image/gif");

      listEl.innerHTML = "";
      for (const f of selectedFiles) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div><b>${escapeHtml(f.name)}</b><div><span>${formatBytes(f.size)}</span></div></div>`;
        listEl.appendChild(div);
      }

      combineBtn.disabled = selectedFiles.length < 2;
      setProgress(0, selectedFiles.length ? `Ready. ${selectedFiles.length} GIF(s) selected.` : "Idle.");
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    // ---- Combine logic ----
    combineBtn.addEventListener("click", async () => {
      setError("");
      downloadLink.style.display = "none";
      previewEl.removeAttribute("src");

      try {
        if (selectedFiles.length < 2) return;
        if (showLibErrorIfAny()) return;

        setProgress(2, "Decoding GIFs…");

        // Decode each GIF into full frames (ImageData) with delays
        const decoded = [];
        let maxW = 0, maxH = 0;

        for (let i = 0; i < selectedFiles.length; i++) {
          const f = selectedFiles[i];
          setProgress(2 + Math.round((i / selectedFiles.length) * 25), `Decoding: ${f.name}`);

          const buf = await readAsArrayBuffer(f);
          const gif = parseGIF(buf);
          const frames = decompressFrames(gif, true); // true => build full frames

          // Determine GIF logical screen size if possible
          // gifuct's parse contains lsd (logical screen descriptor) as "lsd"
          const w = gif.lsd && gif.lsd.width ? gif.lsd.width : (frames[0]?.dims?.width || 0);
          const h = gif.lsd && gif.lsd.height ? gif.lsd.height : (frames[0]?.dims?.height || 0);

          maxW = Math.max(maxW, w);
          maxH = Math.max(maxH, h);

          decoded.push({ file: f, gif, frames, width: w, height: h });
        }

        // Decide output dimensions
        const first = decoded[0];
        const outW =
          outWMode.value === "first" ? first.width :
          outWMode.value === "custom" ? Math.max(16, parseInt(outWCustom.value || "480", 10)) :
          maxW;

        const outH =
          outHMode.value === "first" ? first.height :
          outHMode.value === "custom" ? Math.max(16, parseInt(outHCustom.value || "480", 10)) :
          maxH;

        const fpsCap = Math.max(1, Math.min(60, parseInt(fpsCapEl.value || "30", 10)));
        const minDelayMs = Math.round(1000 / fpsCap); // cap = minimum delay

        setProgress(30, `Encoding output GIF (${outW}×${outH})…`);

        // Prepare encoder
        const isFileOrigin = location.origin === "null" || location.protocol === "file:";
        const gif = new GIFEncoderCtor({
          workers: isFileOrigin ? 0 : 2, // iOS Safari + file:// often blocks workers
          quality: 10,
          width: outW,
          height: outH
        });

        const canvas = document.createElement("canvas");
        canvas.width = outW;
        canvas.height = outH;
        const ctx = canvas.getContext("2d", { willReadFrequently: false });

        // Add frames sequentially
        let totalFrames = decoded.reduce((sum, d) => sum + d.frames.length, 0);
        let frameCount = 0;

        for (let i = 0; i < decoded.length; i++) {
          const d = decoded[i];

          for (let j = 0; j < d.frames.length; j++) {
            const fr = d.frames[j];
            // gifuct frame has .patch (Uint8ClampedArray RGBA) and .dims width/height
            const imgData = new ImageData(fr.patch, fr.dims.width, fr.dims.height);

            drawFrameToCanvas(ctx, imgData, outW, outH, scaleMode.value);

            // fr.delay is usually in hundredths of a second; gifuct gives delay in that unit
            // Some GIFs have 0 delay — clamp it.
            let delayMs = Math.max(10, (fr.delay || 10) * 10);
            delayMs = Math.max(delayMs, minDelayMs);

            gif.addFrame(canvas, { copy: true, delay: delayMs });

            frameCount++;
            if (frameCount % 5 === 0 || frameCount === totalFrames) {
              const pct = 30 + Math.round((frameCount / totalFrames) * 60);
              setProgress(pct, `Encoding… (${frameCount}/${totalFrames} frames)`);
              // Yield to keep iOS Safari responsive
              await new Promise(r => setTimeout(r, 0));
            }
          }
        }

        setProgress(92, "Finalizing…");

        const blob = await new Promise((resolve, reject) => {
          gif.on("finished", resolve);
          gif.on("abort", () => reject(new Error("Encoding aborted")));
          gif.on("error", reject);
          gif.render();
        });

        // Preview + download
        const url = URL.createObjectURL(blob);
        previewEl.src = url;

        downloadLink.href = url;
        downloadLink.style.display = "inline-block";

        setProgress(100, `Done. Output size: ${formatBytes(blob.size)}`);
        statusEl.className = "small ok";
      } catch (e) {
        statusEl.className = "small";
        setProgress(0, "Failed.");
        setError(String(e && e.stack ? e.stack : e));
      }
    });
  </script>
</body>
</html>
